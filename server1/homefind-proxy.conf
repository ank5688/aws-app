   # Apache reverse proxy for Server 1 (web tier)
   # Forwards /api/ requests to Server 2 over the private network.
   # Replace the IP with Server 2's PRIVATE IP if it changes.
   #
   # Install on Server 1:
   #   sudo a2enmod proxy proxy_http
   #   sudo cp homefind-proxy.conf /etc/apache2/conf-available/
   #   sudo a2enconf homefind-proxy
   #   sudo apachectl configtest && sudo systemctl restart apache2

   ProxyPass        "/api/" "http://172.31.22.214/api/"
   ProxyPassReverse "/api/" "http://172.31.22.214/api/"
